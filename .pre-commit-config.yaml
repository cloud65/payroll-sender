#exclude: '^.*/alembic/.*'
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [ python ]

      - id: autoflake
        name: autoflake
        entry: autoflake
        language: system
        types: [ python ]
        args: [ --in-place, --remove-all-unused-imports, --remove-duplicate-keys ]

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        args:
          - "--select=WPS"
          - "--ignore=WPS110,WPS232,WPS111,WPS231,E203,W503,FI10,FI11,FI12,FI13,FI14,FI15,FI16,FI17,FI58,PT013,WPS115,WPS201,WPS202,WPS204,WPS210,WPS213,WPS214,WPS217,WPS220,WPS221,WPS226,WPS229,WPS237,WPS404,WPS411,WPS421,WPS432,WPS457,WPS463,WPS601,WPS615"
          - "--max-line-length=220"
          - '--exclude=*/tests/*'


      - id: isort
        name: isort
        entry: isort
        language: system
        types: [ python ]
        args: ["--profile=black"]

      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [ python ]